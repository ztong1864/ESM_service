# The ESM service next to FounDryClaw:
#   docker compose up -d --build
#
# Nothing is shared with FounDryClaw except the port: sequences arrive over HTTP and results go back in the
# reply, so there is no bind mount of FounDryClaw's workspace (unlike TRACE Lab, which reads project
# folders by path). Point FounDryClaw at it with ESM_SERVICE_BASE_URL in api/.env.
#
# Fetch the model files once into ./models before the first start:
#   python scripts/fetch_models.py
services:
  esm-service:
    build:
      context: .
    image: esm-service:latest
    container_name: esm-service-run
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
